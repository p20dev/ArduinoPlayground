<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arduino Playground</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Arduino UNO R4 WiFi</p>
          <h1>Serveraktivitet</h1>
          <p>Live overblik over REST API-trafik fra Arduino-boardet.</p>
        </div>
        <div id="health" class="status">Forbinder…</div>
      </header>

      <section class="metrics">
        <article><span>Gemte payloads</span><strong id="payloadCount">–</strong></article>
        <article><span>API-hændelser</span><strong id="apiCount">–</strong></article>
        <article><span>Serverhændelser</span><strong id="serverCount">–</strong></article>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div><p class="eyebrow">Aktivitet</p><h2>Seneste hændelser</h2></div>
          <button id="refresh" type="button">Opdatér</button>
        </div>
        <div id="activity" class="activity"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div><p class="eyebrow">API</p><h2>Payloads</h2></div>
          <code>GET /api/payloads</code>
        </div>
        <pre id="payloads">Indlæser…</pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
