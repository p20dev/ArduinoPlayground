services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8152}:80"
    volumes:
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      API_BEARER_TOKEN: ${API_BEARER_TOKEN}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-http://localhost}
      HOST_PORT: ${HOST_PORT:-8152}
      DB_FILE: /data/payloads.sqlite
      DATA_FILE: /data/payloads.json
    volumes:
      - server-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  server-data:
